{% extends "mestre.html" %}

{% block titulo %}
Registrar
{% endblock titulo %}

{% block conteudo %}
<h1>Criar Conta</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar</button>
</form>
<p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock conteudo %}
